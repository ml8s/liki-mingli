name: Sync skill to liki

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-liki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout liki-mingli (source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout liki (distribution)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ml8s/liki
          path: dist
          token: ${{ secrets.SYNC_PAT }}
          persist-credentials: true

      - name: Copy skill files
        run: |
          set -euo pipefail
          mkdir -p dist/skills/liki
          rsync -a --delete skills/liki/ dist/skills/liki/
          cp package.json dist/package.json

      - name: Commit and push
        working-directory: dist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to sync"
            exit 0
          fi
          git add -A
          git commit -m "chore(skill): sync from liki-mingli ${GITHUB_REF_NAME:-manual}"
          git push
